<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoLogin & Task Management</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131d31;
            --accent-color: #38bdf8;
            --success-color: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 20px;
            margin: 0 0 6px 0;
            color: var(--accent-color);
        }
        .header p {
            font-size: 13px;
            color: var(--text-sub);
            margin: 0;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(56, 189, 248, 0.15);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 14px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }
        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .profile-name {
            font-weight: 700;
            font-size: 15px;
        }
        .badge {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 600;
        }
        .profile-desc {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 12px;
        }
        .btn-group {
            display: flex;
            gap: 8px;
        }
        .btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.85;
        }
        .btn-secondary {
            background: #1e293b;
            border: 1px solid #334155;
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 QUẢN LÝ HỆ THỐNG</h1>
        <p id="user-info">Đang kết nối Telegram Mini App...</p>
    </div>

    <div class="card">
        <div class="profile-header">
            <span class="profile-name">🌐 Profile #1: Nuôi Via VN</span>
            <span class="badge">Hoạt động</span>
        </div>
        <div class="profile-desc">Proxy: GSM Direct • Trạng thái: Sẵn sàng</div>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="runAction('check_p1')">Check IP</button>
            <button class="btn" onclick="runAction('start_p1')">Khởi động</button>
        </div>
    </div>

    <div class="card">
        <div class="profile-header">
            <span class="profile-name">🌐 Profile #2: Via US Clone</span>
            <span class="badge">Đang chờ</span>
        </div>
        <div class="profile-desc">Proxy: SOCKS5 • Trạng thái: Chờ lệnh</div>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="runAction('check_p2')">Check IP</button>
            <button class="btn" onclick="runAction('start_p2')">Khởi động</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-info').innerText = `Xin chào, ${tg.initDataUnsafe.user.first_name}! Hệ thống đã sẵn sàng.`;
        }

        function runAction(actionType) {
            tg.sendData(JSON.stringify({ action: actionType, time: new Date().toISOString() }));
            tg.close();
        }
    </script>
</body>
</html>
